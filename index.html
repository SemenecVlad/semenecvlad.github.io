<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemenecVlad — Apps</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f8fb; --fg: #151823; --muted: #5d6475; --card: #ffffff; --line: #e3e6ee; --accent: #3a7bff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0e18; --fg: #e9ecf4; --muted: #9aa2b5; --card: #141930; --line: #242a45; --accent: #6fa0ff; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: 28px; margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .card h2 { margin: 0 0 6px; font-size: 20px; }
    .card p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Apps by SemenecVlad</h1>
    <div class="card">
      <h2>Water Sort</h2>
      <p>A calm color sorting puzzle for Android and iOS.</p>
      <p><a href="/water-sort/privacy/">Privacy Policy</a> · <a href="mailto:watersortapp.support@gmail.com">watersortapp.support@gmail.com</a></p>
    </div>
  </main>
</body>
</html>
